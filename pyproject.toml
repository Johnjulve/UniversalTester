[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-tester"
version = "2.0.1"
description = "Universal 5-pillar software testing, concurrency simulation, and security analysis engine."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "John Andrei Julve", email = "johnandrei.julve@gmail.com" }
]
requires-python = ">=3.9"
dependencies = []
keywords = [
    "testing",
    "benchmarking",
    "concurrency",
    "security-scanner",
    "orchestrator",
    "cli",
    "testx"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
testx = "cli.main:main"
testx-gui = "gui.main:main"

[project.optional-dependencies]
gui = [
    "customtkinter>=6.0.0",
]
benchmarks = [
    "requests>=2.28.0",
    "locust>=2.15.0",
    "pytest>=7.0.0",
    "colorama>=0.4.6",
]
all = [
    "customtkinter>=6.0.0",
    "requests>=2.28.0",
    "locust>=2.15.0",
    "pytest>=7.0.0",
    "colorama>=0.4.6",
]


[tool.setuptools]
py-modules = ["tester"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "adapters*", "Performance*", "cli*", "gui*"]

[tool.setuptools.package-data]
"*" = ["*.json"]
